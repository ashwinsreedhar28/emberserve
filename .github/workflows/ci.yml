name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[server,dev]' matplotlib httpx triton   # triton: CPU interpreter runs the kernels' tests
      - run: ruff check pagedserve tests scripts
      - run: python -m pytest -q -m "not gpu and not hf" --timeout=300
